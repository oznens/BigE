name: Export Tweet Archive Audit

on:
  push:
    branches: ["claude/inspiring-brown-FdsNk"]
    paths: [".github/workflows/export-tweet-archive.yml"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive and split tweet corpus
        run: |
          tar -czf tweet-archive-audit.tar.gz tweetler
          split -b 240M -d -a 2 tweet-archive-audit.tar.gz tweet-archive-part-
          ls -lh tweet-archive-part-*
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: tweet-archive-part-00
          path: tweet-archive-part-00
          retention-days: 1
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: tweet-archive-part-01
          path: tweet-archive-part-01
          retention-days: 1
          compression-level: 0
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: tweet-archive-part-02
          path: tweet-archive-part-02
          retention-days: 1
          compression-level: 0
